[build]
  publish = "."

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/css/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    x-frame-options = "DENY"
    x-content-type-options = "nosniff"
    referrer-policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*"
  [headers.values]
    permissions-policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    cross-origin-opener-policy = "same-origin-allow-popups"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    content-type = "application/manifest+json"

# Internal build notes are not part of the public site
[[redirects]]
  from = "/build_site.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/readme-agent.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/readme-go-live.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/readme-leads.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README-AGENT.md"
  to = "/404.html"
  status = 404
  force = true
